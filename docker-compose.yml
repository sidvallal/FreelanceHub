
services:
  client:
    build: ./client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

  server:
    build: ./server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/freelancehub
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
